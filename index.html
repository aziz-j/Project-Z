<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F8FAFC">
<title>Project Z — Classroom Random Student Picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8FAFC;--ink:#0F172A;--ink2:#475569;--mut:#94A3B8;--line:#E2E8F0;--ind:#4F46E5;--ind2:#4338CA;--indl:#EEF2FF;--ok:#10B981;--bad:#EF4444;--warn:#F59E0B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 32px -16px rgba(15,23,42,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ind);color:#fff;font-weight:700;border-radius:16px;padding:12px 18px;transition:transform .12s,background .15s,box-shadow .15s;box-shadow:0 6px 16px -6px rgba(79,70,229,.6)}
.btn:hover{background:var(--ind2)}.btn:active{transform:scale(.97)}
.btn.big{padding:16px 26px;font-size:17px;border-radius:18px}
.btn.dark{background:var(--ink);box-shadow:0 6px 16px -6px rgba(15,23,42,.5)}.btn.dark:hover{background:#1E293B}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.ghost:hover{background:var(--indl)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none;box-shadow:none}
.ibtn{width:40px;height:40px;border-radius:12px;display:inline-grid;place-items:center;background:#fff;border:1px solid var(--line);font-size:18px}
.ibtn:hover{background:var(--indl)}
.inp{width:100%;border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-size:16px;font-weight:600;background:#fff;outline:none;transition:border .15s,box-shadow .15s}
.inp:focus{border-color:var(--ind);box-shadow:0 0 0 4px rgba(79,70,229,.12)}
.inp.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:26px;letter-spacing:.3em;text-transform:uppercase;text-align:center}
label.l{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:8px}
.muted{color:var(--ink2)}.small{font-size:13px}.grow{flex:1}
.bdg{display:inline-block;border-radius:50%;overflow:hidden;flex:none;box-shadow:inset 0 0 0 3px rgba(255,255,255,.9),0 2px 6px rgba(15,23,42,.18);vertical-align:middle;line-height:0}
.bdg svg{width:100%;height:100%;display:block}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;background:#fff;border:1px solid var(--line);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}.dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(16,185,129,.18)}.dot.mid{background:var(--warn)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#6366F1,#4338CA);color:#fff;display:grid;place-items:center;font-weight:800;box-shadow:0 6px 14px -6px rgba(79,70,229,.7)}
/* landing */
.land{max-width:1040px;margin:0 auto;padding:22px 20px 60px}
.land nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:56px}
.eyebrow{display:inline-block;background:var(--indl);color:var(--ind);font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:7px 14px;border-radius:99px}
.hero{text-align:center}
.hero h1{font-size:clamp(34px,6vw,64px);line-height:1.04;letter-spacing:-.035em;font-weight:800;margin:20px auto 16px;max-width:820px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#4F46E5,#A855F7,#EC4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{font-size:18px;color:var(--ink2);max-width:600px;margin:0 auto 38px;line-height:1.55}
.two{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;text-align:left;max-width:860px;margin:0 auto}
.two .card{display:flex;flex-direction:column;gap:12px;padding:26px}
.marq{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:44px auto 10px;max-width:760px}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:46px;text-align:left}
.feat .card h3{font-size:17px;margin:8px 0 6px}.feat .card p{font-size:14px;color:var(--ink2);line-height:1.5}
.feat .em{font-size:30px}
.recent{max-width:860px;margin:26px auto 0;text-align:left}
.recent a{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--line);border-radius:16px;background:#fff;margin-top:8px;font-weight:700}
.recent a:hover{background:var(--indl)}
.recent code{font-family:ui-monospace,Menlo,monospace;background:var(--indl);color:var(--ind);padding:3px 8px;border-radius:8px;font-size:13px}
/* professor */
.wrap{max-width:1400px;margin:0 auto;padding:16px 18px 40px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ttl{border:2px solid transparent;background:transparent;font-weight:800;font-size:20px;letter-spacing:-.02em;padding:6px 10px;border-radius:12px;min-width:120px;max-width:380px;width:30vw;outline:none}
.ttl:hover,.ttl:focus{border-color:var(--line);background:#fff}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.side{display:flex;flex-direction:column;gap:18px}
.tabs{display:flex;gap:8px;background:var(--bg);padding:6px;border-radius:18px;margin-bottom:14px;flex-wrap:wrap}
.tab{flex:1;min-width:140px;padding:12px 14px;border-radius:14px;font-weight:700;font-size:14px;color:var(--ink2);transition:.15s}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 2px 10px rgba(15,23,42,.1)}
.tab[disabled]{opacity:.5;pointer-events:none}
.stage{position:relative;min-height:440px;border-radius:20px;background:radial-gradient(1200px 420px at 50% 0,#EEF2FF 0,#fff 60%);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage canvas{display:block;max-width:100%;touch-action:none}
.empty{text-align:center;padding:40px 24px;max-width:380px}.empty .big{font-size:54px}.empty h3{font-size:20px;margin:10px 0 6px}.empty p{color:var(--ink2);font-size:14px;line-height:1.5;margin-bottom:14px}
.actions{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:16px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--ink2);text-align:center;margin-top:10px;min-height:18px}
.sec h3{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.qrbox{display:flex;gap:14px;align-items:center}
.qrbox .qr{width:132px;height:132px;flex:none;border-radius:16px;border:1px solid var(--line);padding:6px;background:#fff;cursor:zoom-in}
.qr svg{width:100%;height:100%;display:block}
.codebig{font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:30px;letter-spacing:.14em;color:var(--ind);line-height:1}
.row{display:flex;align-items:center;gap:10px}
.sw{position:relative;width:46px;height:26px;border-radius:99px;background:#CBD5E1;transition:.2s;flex:none}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--ind)}.sw.on::after{left:23px}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;width:100%;text-align:left}
.tgl b{display:block;font-size:14px}.tgl span.s{font-size:12px;color:var(--ink2)}
.list{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin:0 -4px;padding:0 4px}
.li{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:14px;font-weight:600;font-size:14px}
.li:hover{background:var(--bg)}.li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .x{opacity:.0;width:26px;height:26px;border-radius:8px;color:var(--bad);font-weight:800}.li:hover .x{opacity:1}.li .x:hover{background:#FEE2E2}
.li.done .nm{color:var(--mut);text-decoration:line-through}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--indl);color:var(--ind)}
.hl{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;font-weight:600}
/* darts */
.darts{position:relative;width:100%;min-height:440px;padding:18px;align-self:stretch;display:flex;align-items:center;justify-content:center}
.dgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;position:relative;z-index:1;width:100%}
.dcard{width:128px;flex:none;aspect-ratio:3/4;perspective:900px;cursor:none;position:relative}
.dcard.done{pointer-events:none}
.dcard .in{position:absolute;inset:0;transition:transform .8s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.dcard.flip .in{transform:rotateY(180deg)}
.dcard .f,.dcard .b{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden}
.dcard .f{background:linear-gradient(145deg,#4F46E5,#312E81);color:#fff;border:3px solid #fff;box-shadow:0 10px 22px -10px rgba(49,46,129,.8)}
.dcard .f::before{content:'';position:absolute;inset:8px;border:2px dashed rgba(255,255,255,.35);border-radius:10px}
.dcard .f .t{font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}.dcard .f .n{font-size:30px;font-weight:800}
.dcard:hover .f{filter:brightness(1.12)}
.dcard .b{transform:rotateY(180deg);background:#fff;border:3px solid var(--ind);text-align:center;padding:8px}
.dcard .b .nm{font-weight:800;font-size:13px;word-break:break-word;line-height:1.15}
.dlayer{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.dart{position:absolute;left:0;top:0;transform-origin:50% 0;will-change:transform}
.reticle{position:fixed;width:46px;height:46px;margin:-23px 0 0 -23px;pointer-events:none;z-index:50;display:none}
/* overlays */
#ov{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.62);backdrop-filter:blur(6px);padding:20px}
#ov.on{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:32px;padding:34px 30px;text-align:center;max-width:540px;width:100%;box-shadow:0 40px 80px -20px rgba(0,0,0,.5);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6) translateY(30px);opacity:0}to{transform:none;opacity:1}}
.modal .kick{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--ind)}
.modal h2{font-size:clamp(32px,7vw,54px);letter-spacing:-.03em;margin:12px 0 4px;word-break:break-word;line-height:1.05}
.modal .bdg{animation:wob 1.2s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-4deg) scale(1)}to{transform:rotate(4deg) scale(1.06)}}
.qrmodal{max-width:min(92vw,720px)}.qrmodal .qr{width:min(70vh,76vw,560px);height:min(70vh,76vw,560px);margin:14px auto;border:1px solid var(--line);border-radius:24px;padding:14px;background:#fff}
.qrmodal .codebig{font-size:clamp(34px,8vw,72px)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:200;width:100%;height:100%}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;opacity:0;transition:.25s;z-index:300;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
/* student */
.stu{max-width:520px;margin:0 auto;padding:14px 16px 110px}
.stu header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px}
.stu .card{margin-bottom:14px;padding:18px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}.pills::-webkit-scrollbar{display:none}
.pl{padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13px;white-space:nowrap;flex:none}
.pl.on{background:var(--ink);color:#fff;border-color:var(--ink)}.pl.sur{background:var(--indl);color:var(--ind);border-color:#C7D2FE}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px;max-height:300px;overflow-y:auto;padding:6px 2px;-webkit-overflow-scrolling:touch}
.gal button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;border-radius:16px;border:2px solid transparent;font-size:10px;font-weight:700;color:var(--ink2);line-height:1.1;text-align:center}
.gal button.on{border-color:var(--ind);background:var(--indl);color:var(--ind)}
.cw{position:relative;width:230px;height:230px;margin:6px auto}
.cw svg{width:100%;height:100%;display:block;overflow:visible}
.cw .ctr{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.cw path{cursor:pointer;transition:transform .15s;transform-origin:115px 115px}
.cw path:hover{transform:scale(1.04)}.cw path.on{transform:scale(1.08);stroke:#fff;stroke-width:4}
.joinbar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);z-index:20}
.joinbar .btn{width:100%;max-width:520px;margin:0 auto;display:flex}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border:1px solid var(--line);border-radius:99px;font-size:13px;font-weight:700;background:#fff}
.chip.me{border-color:var(--ind);background:var(--indl)}
.win{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;background:linear-gradient(135deg,#EEF2FF,#FDF2F8);border:1px solid #E0E7FF}
.cele{position:fixed;inset:0;z-index:150;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:#fff;background:radial-gradient(circle at 50% 30%,#6366F1,#4338CA 55%,#1E1B4B);padding:24px}
.cele.on{display:flex;animation:fade .3s}
.cele h1{font-size:clamp(40px,12vw,76px);letter-spacing:-.04em;line-height:1}.cele h2{font-size:26px;opacity:.9}
.cele .bdg{animation:wob .9s ease-in-out infinite alternate}
@media(max-width:1020px){.layout{grid-template-columns:1fr}.ttl{width:100%;max-width:none;order:5}.two,.feat{grid-template-columns:1fr}}
@media(max-width:520px){.card{padding:16px;border-radius:22px}.tab{min-width:0;font-size:13px;padding:10px 6px}.qrbox{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div id="app"></div>
<div id="ov"></div>
<svg id="reticleSrc" style="display:none"></svg>
<div class="reticle" id="reticle"><svg viewBox="0 0 46 46" width="46" height="46"><circle cx="23" cy="23" r="14" fill="none" stroke="#EF4444" stroke-width="2.5"/><circle cx="23" cy="23" r="3" fill="#EF4444"/><path d="M23 1v12M23 33v12M1 23h12M33 23h12" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/></svg></div>
<canvas id="confetti"></canvas>
<div id="toast"></div>
<noscript><p style="padding:40px;font-family:sans-serif">Project Z needs JavaScript to run.</p></noscript>
<script>
/* =====================================================================
   PROJECT Z — 108 hand-built SVG characters (6 themes x 18)
   ===================================================================== */
const K='#0F172A',WH='#FFFFFF';
const ci=(x,y,r,f,s,w)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f||'none'}"${s?` stroke="${s}" stroke-width="${w||2}"`:''}/>`;
const el=(x,y,rx,ry,f,s,w,rot)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f||'none'}"${s?` stroke="${s}" stroke-width="${w||2}"`:''}${rot?` transform="rotate(${rot} ${x} ${y})"`:''}/>`;
const rc=(x,y,w,h,r,f,s,sw)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f||'none'}"${s?` stroke="${s}" stroke-width="${sw||2}"`:''}/>`;
const pa=(d,f,s,w)=>`<path d="${d}" fill="${f||'none'}"${s?` stroke="${s}" stroke-width="${w||2}" stroke-linejoin="round" stroke-linecap="round"`:''}/>`;
const pg=(pts,f,s,w)=>pa('M'+pts.map(p=>p.join(' ')).join('L')+'Z',f,s,w);
const ln=(x1,y1,x2,y2,c,w)=>pa(`M${x1} ${y1}L${x2} ${y2}`,0,c||K,w||2.5);
const tr=(x,y,s,sc)=>`<g transform="translate(${x} ${y})${sc?` scale(${sc})`:''}">${s}</g>`;
const star=(cx,cy,R,r,n=5,rot=-90)=>{const p=[];for(let i=0;i<n*2;i++){const a=(rot+i*180/n)*Math.PI/180,q=i%2?r:R;p.push([+(cx+q*Math.cos(a)).toFixed(1),+(cy+q*Math.sin(a)).toFixed(1)]);}return p;};
function eyes(y,gap,s,c){c=c||K;const a=50-gap,b=50+gap;switch(s){
 case'big':return ci(a,y,6,WH,K,1.5)+ci(b,y,6,WH,K,1.5)+ci(a+1,y+1,3,c)+ci(b+1,y+1,3,c);
 case'happy':return pa(`M${a-4} ${y+2}Q${a} ${y-5} ${a+4} ${y+2}`,0,c,2.8)+pa(`M${b-4} ${y+2}Q${b} ${y-5} ${b+4} ${y+2}`,0,c,2.8);
 case'sleepy':return pa(`M${a-4} ${y}Q${a} ${y+5} ${a+4} ${y}`,0,c,2.8)+pa(`M${b-4} ${y}Q${b} ${y+5} ${b+4} ${y}`,0,c,2.8);
 case'wink':return ci(a,y,3.2,c)+pa(`M${b-4} ${y+2}Q${b} ${y-5} ${b+4} ${y+2}`,0,c,2.8);
 case'star':return pg(star(a,y,5.5,2.4),c)+pg(star(b,y,5.5,2.4),c);
 default:return ci(a,y,3.3,c)+ci(b,y,3.3,c)+ci(a+1,y-1.2,1.1,WH)+ci(b+1,y-1.2,1.1,WH);}}
function mouth(y,s,cx,c){cx=cx||50;c=c||K;switch(s){
 case'grin':return pa(`M${cx-8} ${y-1}Q${cx} ${y+11} ${cx+8} ${y-1}Z`,WH,c,2);
 case'o':return el(cx,y+2,3,4,c);
 case'flat':return ln(cx-5,y+2,cx+5,y+2,c,2.5);
 case'tongue':return pa(`M${cx-7} ${y}Q${cx} ${y+8} ${cx+7} ${y}`,0,c,2.5)+pa(`M${cx-2} ${y+4}Q${cx} ${y+11} ${cx+3} ${y+4}`,'#F87171');
 case'cat':return pa(`M${cx-7} ${y}Q${cx-3.5} ${y+5} ${cx} ${y}Q${cx+3.5} ${y+5} ${cx+7} ${y}`,0,c,2.3);
 default:return pa(`M${cx-6} ${y}Q${cx} ${y+7} ${cx+6} ${y}`,0,c,2.6);}}
const cheeks=(y,gap,c)=>`<g opacity=".45">${ci(50-(gap||17),y,3.6,c||'#FB7185')}${ci(50+(gap||17),y,3.6,c||'#FB7185')}</g>`;
const face=(y,o)=>{o=o||{};return eyes(y,o.g||11,o.e||'dot',o.c)+mouth(y+12,o.m||'smile',50,o.mc)+(o.ch===false?'':cheeks(y+7,o.cg||17,o.cc));};

 $('#cf').onsubmit=e=>{e.preventDefault();createSession($('#ct').value);};
 const rc=$('#rc');rc.oninput=()=>{rc.value=rc.value.toUpperCase().replace(/[^A-Z0-9]/g,'');};
 $('#jf').onsubmit=e=>{e.preventDefault();const v=rc.value.trim();if(v.length!==6){toast('Room codes have 6 characters');rc.focus();return;}location.href='?session='+v+'&qr=1';};
}

/* =====================================================================
   PROFESSOR DASHBOARD
   ===================================================================== */
let pubT=null;
function publishNow(){if(!net||!S)return;net.send('state',S,true);}
function queuePublish(){clearTimeout(pubT);pubT=setTimeout(publishNow,60);}
function commit(){S.rev=(S.rev||0)+1;ls.set('pz_state_'+CODE,S);queuePublish();}
function hostDenied(){app.innerHTML=`<div class="land"><nav><div class="brand"><span class="logo">Z</span>Project Z</div></nav><div class="card" style="max-width:480px;margin:40px auto;text-align:center;padding:34px"><div style="font-size:48px">🔒</div><h2 style="margin:10px 0 6px">Host access required</h2><p class="muted" style="margin-bottom:20px;line-height:1.5">This browser doesn’t hold the host key for session <b>${esc(CODE)}</b>. Only the device that created a session can control it.</p><div style="display:grid;gap:10px"><a class="btn" href="?session=${esc(CODE)}&qr=1">Join as a student</a><a class="btn ghost" href="./">Create a new session</a></div></div></div>`;}
function addPlayers(names){let n=0;const idx=shuffle(AV.map(a=>a.idx));names.forEach(nm=>{nm=nm.replace(/\s+/g,' ').trim().slice(0,18);if(!nm)return;S.players.push({id:uid(6),n:nm,a:idx[n%idx.length],c:PAL[randInt(12)],j:Date.now(),d:false});n++;});if(n){commit();renderSide();stageSync();}return n;}
function addSample(){addPlayers(['Ava','Liam','Noah','Mia','Zoe','Kai']);toast('Added a 6-student sample class');}
function nextRound(){S.players.forEach(p=>p.d=false);S.round++;commit();renderSide();stageSync();toast('Round '+S.round+' started');}
function removePlayer(id){S.players=S.players.filter(p=>p.id!==id);commit();renderSide();stageSync();}
function handleProMsg(m){if(!S)return;const d=m.d;
 if(m.t==='join'){const p=cleanPlayer(d);if(!p)return;const ex=S.players.find(x=>x.id===p.id);if(ex){publishNow();return;}if(!S.open)return;S.players.push(p);commit();renderSide();stageSync();toast(p.n+' joined');Snd.tone(660,.12,'sine',.08,0,990);}
 else if(m.t==='leave'&&d&&typeof d.id==='string'){if(S.players.some(x=>x.id===d.id)){S.players=S.players.filter(x=>x.id!==d.id);commit();renderSide();stageSync();}}
 else if(m.t==='hello'){publishNow();}}
function startPro(){TOKEN=ls.get('pz_admin_'+CODE);if(!TOKEN){hostDenied();return;}
 S=ls.get('pz_state_'+CODE)||newState(CODE,'My Class');S.code=CODE;renderPro();
 net=createNet(CODE,handleProMsg,setStatus,publishNow);bootRealtime(net);setTimeout(publishNow,300);
 loadScript(['https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js','https://unpkg.com/qrcode-generator@1.4.4/qrcode.js']).then(()=>refreshQR());
 addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||$('#ov').classList.contains('on'))return;if(e.code==='Space'){e.preventDefault();const g=$('#go');if(g&&!g.disabled)g.click();}});}
function refreshQR(){const q=$('#qrMini');if(q)q.innerHTML=qrHTML(joinURL(CODE));}
function openQR(){const ov=$('#ov');if(ov.classList.contains('on'))return;const url=joinURL(CODE);ov.innerHTML=`<div class="modal qrmodal"><div class="kick">Scan to join · ${esc(S.title)}</div><div class="qr">${qrHTML(url)}</div><div class="codebig">${CODE}</div><p class="small muted" style="margin:10px 0 18px;word-break:break-all">${esc(url)}</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn" id="qcp">Copy Join Link</button><button class="btn ghost" id="qcl">Close</button></div></div>`;ov.classList.add('on');const close=()=>{ov.classList.remove('on');ov.innerHTML='';removeEventListener('keydown',kd)};const kd=e=>{if(e.key==='Escape')close()};addEventListener('keydown',kd);$('#qcl').onclick=close;$('#qcp').onclick=()=>copyText(url);ov.onclick=e=>{if(e.target===ov)close()};}
function renderPro(){
 app.innerHTML=`<div class="wrap">
 <header class="top"><div class="brand"><span class="logo">Z</span><span>Project Z</span></div><input id="ttl" class="ttl" maxlength="60" value="${esc(S.title)}" aria-label="Class title"><div class="grow"></div><span id="stat" class="pill">${statusPill()}</span><button class="ibtn" id="mute" title="Sound on/off"></button><a class="ibtn" href="./" title="Home">⌂</a></header>
 <div class="layout">
  <section class="card"><div class="tabs">${['wheel','sphere','darts'].map(m=>`<button class="tab ${Stage.mode===m?'on':''}" data-m="${m}">${{wheel:'🎡 Spinning Wheel',sphere:'🔮 3D Lottery Sphere',darts:'🎯 Card Darts'}[m]}</button>`).join('')}</div>
   <div class="stage" id="stage"></div>
   <div class="actions"><button class="btn big" id="go"></button><button class="btn ghost" id="aux"></button></div><div class="hint" id="hint"></div></section>
  <aside class="side">
   <div class="card sec"><h3>Student check-in <span class="tag" id="cnt"></span></h3><div class="qrbox"><div class="qr" id="qrMini" title="Click to enlarge for the projector"></div><div style="min-width:0"><div class="small muted" style="margin-bottom:4px">Room code</div><div class="codebig">${CODE}</div><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn sm" id="qrBig">⛶ Enlarge</button><button class="btn sm ghost" id="cpl">Copy Join Link</button></div></div></div></div>
   <div class="card sec" id="ctrl"><h3>Room controls</h3>
    <button class="tgl" id="tOpen"><div><b id="tOpenT"></b><span class="s">Lock the room to stop new students joining</span></div><span class="sw" id="swOpen"></span></button>
    <button class="tgl" id="tRep"><div><b>Allow repeat picks</b><span class="s">Off = nobody is picked twice per round</span></div><span class="sw" id="swRep"></span></button>
    <div class="row" style="margin:10px 0"><button class="btn ghost sm grow" id="nextR"></button></div>
    <form id="addF" class="row" style="gap:8px"><input class="inp" id="addI" placeholder="Add student name(s)…" maxlength="120" style="padding:10px 12px;font-size:14px"><button class="btn sm" type="submit">Add</button></form>
    <button class="btn ghost sm" id="smp" style="margin-top:10px;width:100%">＋ Add 6-student sample class</button></div>
   <div class="card sec"><h3>Students <span class="tag" id="rc2"></span></h3><div class="list" id="roster"></div></div>
   <div class="card sec"><h3>Spin history</h3><div class="list" id="hist"></div></div>
  </aside></div></div>`;
 const mute=$('#mute');const pm=()=>mute.textContent=Snd.mute?'🔇':'🔊';pm();mute.onclick=()=>{Snd.mute=!Snd.mute;ls.set('pz_mute',Snd.mute);pm();Snd.ensure();};
 $('#ttl').onchange=e=>{S.title=e.target.value.trim().slice(0,60)||'My Class';e.target.value=S.title;commit();};
 $$('.tab').forEach(t=>t.onclick=()=>setMode(t.dataset.m));
 $('#go').onclick=()=>Modes[Stage.mode].act();$('#aux').onclick=()=>{const m=Modes[Stage.mode];m.shake&&m.shake();};
 $('#qrBig').onclick=openQR;$('#qrMini').onclick=openQR;$('#cpl').onclick=()=>copyText(joinURL(CODE));
 $('#tOpen').onclick=()=>{S.open=!S.open;commit();renderSide();toast(S.open?'Room unlocked — students can join':'Room locked');};
 $('#tRep').onclick=()=>{S.repeat=!S.repeat;commit();renderSide();stageSync();};
 $('#nextR').onclick=nextRound;$('#smp').onclick=addSample;
 $('#addF').onsubmit=e=>{e.preventDefault();const i=$('#addI');addPlayers(i.value.split(/[,\n;]+/));i.value='';i.focus();};
 $('#roster').onclick=e=>{const b=e.target.closest('[data-x]');if(b)removePlayer(b.dataset.x);};
 refreshQR();renderSide();stageSync(true);}
function renderSide(){if(!$('#roster'))return;const P=S.players,done=P.filter(p=>p.d).length;
 $('#cnt').textContent=P.length+' joined';$('#rc2').textContent=P.length;
 $('#tOpenT').textContent=S.open?'Room is open':'Room is locked';$('#swOpen').classList.toggle('on',S.open);$('#swRep').classList.toggle('on',S.repeat);
 const nb=$('#nextR');nb.textContent=`↻ Start Next Round · R${S.round} · ${done}/${P.length} picked`;nb.toggleAttribute('disabled',!done);
 $('#roster').innerHTML=P.length?P.map(p=>`<div class="li ${p.d&&!S.repeat?'done':''}">${badge(p,34)}<span class="nm">${esc(p.n)}</span>${p.d?'<span class="tag">✓ R'+S.round+'</span>':''}<button class="x" data-x="${p.id}" title="Remove">✕</button></div>`).join(''):'<p class="small muted" style="padding:8px">No students yet.</p>';
 $('#hist').innerHTML=S.hist.length?S.hist.map(h=>`<div class="li">${badge(h,30)}<span class="nm">${esc(h.n)}<br><span class="hl">${MODE_NAME[h.m]||h.m} · Round ${h.r}</span></span><span class="hl">${fmtT(h.t)}</span></div>`).join(''):'<p class="small muted" style="padding:8px">Picks will be logged here.</p>';}

/* =====================================================================
   STUDENT MOBILE EXPERIENCE
   ===================================================================== */
let ME=null,F={name:'',theme:-1,av:0,col:PAL[0]},lastK=undefined,firstState=true,joinSent=0,helloT=null;
const inRoster=()=>S&&ME&&S.players.some(p=>p.id===ME.id);
function sendJoin(){if(!ME||!net)return;net.send('join',{id:ME.id,n:ME.n,a:ME.a,c:ME.c});joinSent=Date.now();}
function startStudent(){ME=ls.get('pz_me_'+CODE);F.av=randInt(AV.length);F.col=PAL[randInt(12)];
 net=createNet(CODE,handleStuMsg,setStatus,()=>{net.send('hello',{});sendJoin();});bootRealtime(net);
 renderStudent();net.send('hello',{});if(ME)sendJoin();
 helloT=setInterval(()=>{if(!S)net.send('hello',{});else if(ME&&!inRoster()&&!ME.ack&&S.open&&Date.now()-joinSent>2500)sendJoin();},3000);}
function handleStuMsg(m){if(m.t!=='state'||!m.d||m.d.code!==CODE)return;if(S&&m.d.rev<S.rev)return;S=m.d;
 if(firstState){firstState=false;lastK=S.last?S.last.k:null;}else if(S.last&&S.last.k!==lastK){lastK=S.last.k;if(ME&&S.last.id===ME.id)celebrate();}
 paintStudent();}
function stuHeader(){return `<header><div class="brand"><span class="logo">Z</span><span>Project Z</span></div><span class="pill" id="stat">${statusPill()}</span></header>`;}
function renderStudent(){app.innerHTML=`<div class="stu" id="stu">${stuHeader()}<div id="stuBody"></div></div>`;paintStudent(true);}
function paintStudent(first){const body=$('#stuBody');if(!body)return;if(ME)return renderWait();
 if(!$('#nm')){renderForm();}
 const t=$('#fTitle');if(t)t.textContent=S?S.title:'Connecting to class…';const lk=$('#fLock'),jb=$('#jbtn');const locked=S&&!S.open;if(lk)lk.style.display=locked?'block':'none';if(jb)jb.toggleAttribute('disabled',locked||!F.name.trim());}
function renderForm(){const body=$('#stuBody');
 body.innerHTML=`<div class="card"><div class="small muted" style="font-weight:700">YOU’RE JOINING</div><h2 id="fTitle" style="font-size:24px;letter-spacing:-.02em;margin:2px 0 2px">${S?esc(S.title):'Connecting to class…'}</h2><span class="tag">Room ${CODE}</span><div id="fLock" style="display:none;margin-top:12px;padding:12px;border-radius:14px;background:#FEF3C7;color:#92400E;font-weight:700;font-size:14px">🔒 The host has locked the room — new students can’t join right now.</div></div>
 <div class="card"><label class="l" for="nm">Your name</label><input class="inp" id="nm" maxlength="18" placeholder="Type your name" autocomplete="off" value="${esc(F.name)}"></div>
 <div class="card"><label class="l">Your character</label><div class="pills" id="pills"></div><div class="gal" id="gal"></div></div>
 <div class="card"><label class="l">Your colour</label><div class="cw" id="cw"></div><div style="text-align:center;font-weight:800;font-size:18px" id="pvn">&nbsp;</div></div>
 <div class="joinbar"><button class="btn big" id="jbtn" disabled>JOIN SESSION</button></div>`;
 const pills=$('#pills');pills.innerHTML=`<button class="pl sur" id="sur">🎲 Surprise Me</button><button class="pl on" data-t="-1">All · 108</button>`+THEMES.map((t,i)=>`<button class="pl" data-t="${i}">${t.icon} ${esc(t.name)}</button>`).join('');
 pills.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='sur'){surprise();return;}F.theme=+b.dataset.t;$$('.pl[data-t]',pills).forEach(x=>x.classList.toggle('on',+x.dataset.t===F.theme));paintGallery();};
 $('#gal').onclick=e=>{const b=e.target.closest('button');if(!b)return;F.av=+b.dataset.a;paintSel();};
 $('#nm').oninput=e=>{F.name=e.target.value;paintStudent();paintPreview();};
 $('#jbtn').onclick=doJoin;
 paintGallery();paintWheel();paintPreview();}
function paintGallery(){const g=$('#gal');if(!g)return;const list=F.theme<0?AV:AV.filter(a=>a.theme===F.theme);g.innerHTML=list.map(a=>`<button data-a="${a.idx}" class="${a.idx===F.av?'on':''}">${badge({a:a.idx,c:F.col},48)}<span>${esc(a.name)}</span></button>`).join('');}
function paintSel(){$$('#gal button').forEach(b=>b.classList.toggle('on',+b.dataset.a===F.av));paintPreview();}
function paintColors(){$$('#gal .bdg').forEach(b=>b.style.background=F.col);paintPreview();}
function paintPreview(){const c=$('#cwBadge');if(c){c.innerHTML=badge({a:F.av,c:F.col},112);}const n=$('#pvn');if(n)n.textContent=(F.name.trim()||'Your name')+' · '+AV[F.av].name;}
function paintWheel(){const cw=$('#cw');if(!cw)return;const R=112,r=66,C=115;let s='';for(let i=0;i<12;i++){const a0=(i*30-90-15)*Math.PI/180,a1=(i*30-90+15)*Math.PI/180,p=(rad,a)=>[+(C+rad*Math.cos(a)).toFixed(2),+(C+rad*Math.sin(a)).toFixed(2)];const A=p(R,a0),B=p(R,a1),Cc=p(r,a1),D=p(r,a0);s+=`<path data-c="${i}" class="${PAL[i]===F.col?'on':''}" fill="${PAL[i]}" stroke="#fff" stroke-width="2" d="M${A}A${R} ${R} 0 0 1 ${B}L${Cc}A${r} ${r} 0 0 0 ${D}Z"/>`;}
 cw.innerHTML=`<svg viewBox="0 0 230 230">${s}</svg><div class="ctr"><div id="cwBadge"></div></div>`;$('svg',cw).onclick=e=>{const p=e.target.closest('path');if(!p)return;F.col=PAL[+p.dataset.c];$$('#cw path').forEach(x=>x.classList.toggle('on',x===p));paintColors();Snd.tick();};}
function surprise(){const pool=F.theme<0?AV:AV.filter(a=>a.theme===F.theme);F.av=pickOne(pool).idx;F.col=PAL[randInt(12)];paintGallery();paintWheel();paintPreview();const b=$(`#gal button[data-a="${F.av}"]`);if(b)b.scrollIntoView({block:'nearest',behavior:'smooth'});Snd.pop();}
function doJoin(){const n=F.name.trim().replace(/\s+/g,' ').slice(0,18);if(!n)return;if(S&&!S.open){toast('The room is locked');return;}ME={id:uid(8),n,a:F.av,c:F.col,ack:false};ls.set('pz_me_'+CODE,ME);sendJoin();Snd.pop();renderWait();}
function renderWait(){const body=$('#stuBody');if(!body||!ME)return;const inR=inRoster();if(inR&&!ME.ack){ME.ack=true;ls.set('pz_me_'+CODE,ME);}
 if(!inR&&ME.ack&&S){body.innerHTML=`<div class="card" style="text-align:center;padding:32px"><div style="font-size:44px">👋</div><h2 style="margin:8px 0">You were removed</h2><p class="muted" style="margin-bottom:18px">The host removed you from this session.</p><button class="btn" id="rej">Join again</button></div>`;$('#rej').onclick=()=>{ME.ack=false;ls.set('pz_me_'+CODE,ME);sendJoin();renderWait();};return;}
 const P=S?S.players:[],l=S&&S.last;
 body.innerHTML=`<div class="card" style="text-align:center;padding:26px 18px"><div>${badge(ME,132)}</div><h2 style="font-size:28px;letter-spacing:-.03em;margin-top:12px">${esc(ME.n)}</h2><p class="muted" style="margin:4px 0 12px;font-weight:600">${S?esc(S.title):'Connecting…'}</p>${inR?`<span class="pill"><span class="dot on"></span>You’re in · waiting for the next pick</span>`:`<span class="pill"><span class="dot mid"></span>${S?'Joining…':'Waiting for the host…'}</span>`}${S&&!S.open&&!inR?'<p class="small muted" style="margin-top:12px">The host has locked the room.</p>':''}</div>
 ${l?`<div class="card"><label class="l">Latest pick</label><div class="win">${badge(l,52)}<div><div style="font-weight:800;font-size:18px">${esc(l.n)}</div><div class="small muted">${MODE_NAME[l.m]||''} · Round ${S.round}</div></div></div></div>`:''}
 <div class="card"><label class="l">In the room · ${P.length}</label><div class="chips">${P.map(p=>`<span class="chip ${p.id===ME.id?'me':''}">${badge(p,28)}${esc(p.n)}${p.d&&!S.repeat?' ✓':''}</span>`).join('')||'<span class="small muted">Nobody yet</span>'}</div></div>
 <div style="text-align:center"><button class="btn ghost sm" id="leave">Leave session</button></div>`;
 $('#leave').onclick=()=>{if(net)net.send('leave',{id:ME.id});ls.del('pz_me_'+CODE);ME=null;renderStudent();};}
function celebrate(){let c=$('#cele');if(!c){c=document.createElement('div');c.id='cele';c.className='cele';document.body.appendChild(c);}c.innerHTML=`<div style="font-size:26px;font-weight:800;letter-spacing:.2em;opacity:.85">YOU’VE BEEN PICKED</div><div>${badge(ME,190)}</div><h1>It’s YOU!</h1><h2>${esc(ME.n)}</h2><button class="btn ghost" id="cok" style="margin-top:14px">Got it</button>`;c.classList.add('on');Snd.fanfare();try{navigator.vibrate&&navigator.vibrate([200,100,200,100,400]);}catch(e){}Confetti.burst(innerWidth/2,innerHeight*.35,220,1.3);Confetti.rain(120);setTimeout(()=>Confetti.burst(innerWidth*.2,innerHeight*.5,100),400);setTimeout(()=>Confetti.burst(innerWidth*.8,innerHeight*.5,100),700);$('#cok').onclick=()=>c.classList.remove('on');}

/* =====================================================================
   BOOT
   ===================================================================== */
Confetti.init();
if(!CODE||CODE.length!==6){landing();if(params.get('session'))toast('That room code looks incomplete');}
else if(ROLE_PRO)startPro();
else startStudent();
</script>
